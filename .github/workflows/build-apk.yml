name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # Step 3: Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true


      # Step 4: Check Flutter installation
      - name: Flutter Doctor
        run: flutter doctor -v


      # Step 5: Get Flutter dependencies
      - name: Get Dependencies
        run: flutter pub get


      # Step 6: Analyze project
      - name: Analyze Project
        run: flutter analyze


      # Step 7: Build Debug APK
      - name: Build Debug APK
        run: flutter build apk --debug


      # Step 8: Check APK exists
      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK_PATH"


      # Step 9: Upload APK as GitHub Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30


      # Step 10: Prepare Release Information
      - name: Prepare Release Information
        id: release_info
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # Step 11: Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.release_title }}
          ASSET_PATH: ${{ steps.release_info.outputs.apk_path }}

          NOTES: |
            ### Automated Debug APK Build

            **Notice:** This is an automatically generated debug APK.

            - **Build:** The APK was built by GitHub Actions.
            - **Run Number:** ${{ github.run_number }}
            - **Run Attempt:** ${{ github.run_attempt }}
            - **Source Commit SHA:** ${{ github.sha }}
            - **Intended Purpose:** The APK is intended for testing.
            - **Production Status:** The APK is not a Play Store production release.
            - **Signing:** The APK is signed only with a temporary debug keystore.

        run: |
          echo "Creating GitHub Release..."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

          echo "Release created successfully!"
