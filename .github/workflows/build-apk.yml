name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # Check Flutter
      - name: Flutter Doctor
        run: flutter doctor -v


      # Get dependencies
      - name: Get Dependencies
        run: flutter pub get


      # Build APK
      - name: Build Debug APK
        run: flutter build apk --debug


      # Verify APK
      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK_PATH"


      # Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30


      # Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debug APK Build

          Build generated automatically using GitHub Actions.

          Run Number: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}

          This APK is intended for testing purposes." \
            --latest
