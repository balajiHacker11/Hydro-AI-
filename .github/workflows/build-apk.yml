name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 1. Checkout Repository
      # -----------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------
      # 2. Show Repository Files
      # -----------------------------------
      - name: Check Project Structure
        run: |
          echo "Repository structure:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Searching for pubspec.yaml..."

          find . -name "pubspec.yaml"


      # -----------------------------------
      # 3. Setup Java
      # -----------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -----------------------------------
      # 4. Setup Flutter
      # -----------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # -----------------------------------
      # 5. Flutter Doctor
      # -----------------------------------
      - name: Flutter Doctor
        run: flutter doctor -v


      # -----------------------------------
      # 6. Find Flutter Project
      # -----------------------------------
      - name: Find Flutter Project
        id: flutter_project
        run: |
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.pub-cache/*" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "This repository may not be a Flutter project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # -----------------------------------
      # 7. Get Dependencies
      # -----------------------------------
      - name: Get Dependencies
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter pub get


      # -----------------------------------
      # 8. Build Debug APK
      # -----------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter build apk --debug


      # -----------------------------------
      # 9. Find Generated APK
      # -----------------------------------
      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find . -path "*/build/app/outputs/flutter-apk/app-debug.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found at: $APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # -----------------------------------
      # 10. Verify APK
      # -----------------------------------
      - name: Verify APK
        run: |
          ls -lh "${{ steps.apk.outputs.apk_path }}"


      # -----------------------------------
      # 11. Upload APK
      # -----------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30


      # -----------------------------------
      # 12. Create GitHub Release
      # -----------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}"

          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.apk_path }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debug APK Build - Generated using GitHub Actions. Build Number: ${GITHUB_RUN_NUMBER}" \
            --latest
